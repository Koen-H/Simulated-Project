name: Build dev JARs
on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
      - name: Build mods
        env:
          local_maven_user: ${{ secrets.MAVEN_USERNAME }}
          local_maven_token: ${{ secrets.MAVEN_TOKEN }}
        run: ./gradlew build
      - name: Upload NeoForge JARs
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-jars-${{ github.sha }}
          path: |
            simulated/neoforge/build/libs/*.jar
            aeronautics/neoforge/build/libs/*.jar
            offroad/neoforge/build/libs/*.jar
            all-neoforge/build/libs/*.jar
            aeronautics-bundled/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
